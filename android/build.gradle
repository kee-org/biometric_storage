group 'design.codeux.biometric_storage'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'

// For Flutter < 3.44 (AGP < 9): apply KGP manually since Flutter's built-in Kotlin
// is not available in those environments.
//
// For Flutter >= 3.44 (AGP >= 9): KGP is injected by Flutter's built-in Kotlin mechanism.
// We deliberately use pluginManager.apply() instead of `apply plugin: 'kotlin-android'`
// so that Flutter's KGP regex scanner does NOT find a manual declaration and correctly
// triggers its built-in Kotlin injection path.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    pluginManager.apply("kotlin-android")
}

android {
    namespace "design.codeux.biometric_storage"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 23
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'proguard.pro'
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

pluginManager.withPlugin("org.jetbrains.kotlin.android") {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

dependencies {
    def biometric_version = "1.4.0-alpha02"

    api "androidx.core:core-ktx:1.10.1"
    api "androidx.fragment:fragment-ktx:1.6.1"

    implementation "org.slf4j:slf4j-api:2.0.7"
    implementation "androidx.biometric:biometric:$biometric_version"
    implementation "io.github.oshai:kotlin-logging-jvm:5.0.1"
}
